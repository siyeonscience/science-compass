<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과학 나침반</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --amber:#d97706; --amber-l:#f59e0b; --amber-bg:#fffbeb;
  --ink:#1f2937; --mut:#6b7280; --line:#e5e7eb; --bg:#eef0f8; --card:#fff;
  --phy:#2563eb; --che:#7c3aed; --bio:#059669; --ear:#0d9488; --eng:#ea580c;
  --ok:#16a34a; --no:#dc2626;
}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none !important}

/* ---------- 로그인 ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.loginbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 32px;max-width:400px;width:100%;text-align:center}
.loginbox .logo{width:56px;height:56px;border-radius:14px;background:var(--amber);display:flex;align-items:center;
  justify-content:center;font-size:28px;margin:0 auto 16px}
.loginbox h1{font-size:22px;margin-bottom:6px}
.loginbox p{font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:24px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;
  border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:600;background:#fff}
.gbtn:hover{background:#f9fafb}
.gbtn svg{width:18px;height:18px}
.loginnote{margin-top:16px;font-size:12px;color:var(--mut);line-height:1.6}
.err{margin-top:14px;font-size:13px;color:var(--no);line-height:1.6}

/* ---------- 헤더 ---------- */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hwrap{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.brand .ic{width:32px;height:32px;border-radius:9px;background:var(--amber);display:flex;align-items:center;
  justify-content:center;font-size:17px;align-self:center;flex:none}
.brand h1{font-size:19px;letter-spacing:-.4px;white-space:nowrap}
.brand .sub{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge{display:flex;align-items:center;gap:8px;flex:none}
.gauge .bolt{color:var(--amber-l);font-size:17px}
.gauge .num{font-weight:700;font-size:14px;min-width:12px}
.slots{display:flex;gap:4px}
.slot{width:17px;height:24px;border-radius:4px;background:#f3f4f6;border:1px solid var(--line)}
.slot.on{background:var(--amber-l);border-color:var(--amber)}
.gtext{font-size:10px;color:var(--mut);line-height:1.3;text-align:right}
.gtext b{display:block;font-size:12px;color:var(--amber)}
.hbtn{padding:6px 11px;border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:600;background:#fff}
.hbtn:hover{background:#f9fafb}
.hbtn.tch{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}

/* ---------- 필터 ---------- */
main{max-width:1280px;margin:0 auto;padding:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{padding:9px 15px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px;
  font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
.chip:hover{border-color:#c7cbd3}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chip.on{color:#fff;border-color:transparent}
.chip.on .dot{background:#fff !important}
.chip.rand{background:var(--amber);color:#fff;border-color:transparent}
.chip.sep{margin-left:6px}
.count{font-size:12px;color:var(--mut);margin-bottom:12px}

/* ---------- 카드 ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;
  border:1px solid rgba(0,0,0,.04);transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.thumb{aspect-ratio:16/10;position:relative;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb .pm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.thumb .pm i{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-style:normal;
  font-size:16px;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:10px;left:10px;background:rgba(17,24,39,.82);color:#fff;font-size:11px;
  font-weight:600;padding:4px 9px;border-radius:6px}
.cbody{padding:12px 14px 14px}
.crow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ccat{font-size:12px;font-weight:700}
.star{font-size:16px;color:#cbd5e1;line-height:1}
.star.on{color:var(--amber-l)}
.ctitle{font-size:15px;font-weight:700;line-height:1.4;margin-bottom:7px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cdesc{font-size:12.5px;color:var(--mut);line-height:1.55;margin-bottom:11px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.careers{display:flex;flex-wrap:wrap;gap:6px}
.ctag{font-size:11.5px;padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:5px}
.ctag .dot{width:5px;height:5px;border-radius:50%}
.ctag.more{background:#f3f4f6;color:var(--mut)}
.empty{text-align:center;padding:70px 20px;color:var(--mut);font-size:14px;line-height:1.8}

/* ---------- 모달 ---------- */
.back{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;
  align-items:center;justify-content:center;padding:24px}
.sheet{background:#fff;border-radius:16px;width:100%;max-width:680px;max-height:calc(100vh - 48px);
  display:flex;flex-direction:column;overflow:hidden}
.sheet.wide{max-width:900px}
.shead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);flex:none}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:16px;background:#fff}
.iconbtn:hover{background:#f9fafb}
.sbody{overflow-y:auto;padding:18px}
.shead h3{font-size:15px;font-weight:700}
@media(max-width:640px){.back{padding:0}.sheet{max-width:none;border-radius:0;max-height:100vh;height:100vh}}

.hero{aspect-ratio:16/9;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:64px;position:relative;margin-bottom:12px}
.openbtn{width:100%;padding:13px;background:#f3f4f6;border-radius:10px;font-size:14px;font-weight:700;margin-bottom:16px}
.openbtn:hover{background:#e9ebef}
.mediabox{margin-bottom:16px}
.hero{overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero.clickable{cursor:pointer}
.notice{border:1px solid var(--line);background:#fffbeb;border-radius:10px;padding:13px 15px;
  font-size:13px;color:#92400e;line-height:1.6;margin-bottom:16px}
.ver{position:fixed;right:9px;bottom:7px;font-size:10px;color:#b6bcc6;z-index:5;letter-spacing:.02em}
.playmark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.playmark i{width:62px;height:62px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:24px;font-style:normal}
.framewrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;margin-bottom:10px}
.framewrap.tall{aspect-ratio:auto;height:62vh;min-height:380px;background:#fff;border:1px solid var(--line)}
.framewrap iframe{width:100%;height:100%;border:0;display:block}
.fallback{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;
  justify-content:center;background:#f8f9fb;color:#6b7280;font-size:13px;text-align:center;padding:22px;line-height:1.7}
.reader{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fdfdfd;
  margin-bottom:10px;max-height:62vh;overflow-y:auto}
.reader p{font-size:14px;line-height:1.85;margin-bottom:13px;white-space:pre-wrap}
.readernote{font-size:11.5px;color:#6b7280;margin-bottom:10px;font-weight:600}
.linkbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.linkbar button,.linkbar a{font-size:12px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--fg);text-decoration:none;font-weight:600;cursor:pointer}
.linkbar button:hover,.linkbar a:hover{background:#f3f4f6}
.linkbar .tipx{font-size:11.5px;color:#6b7280;font-weight:400;border:0;background:none;padding:0}
.metarow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.mtag{font-size:11.5px;padding:4px 9px;border-radius:6px;background:#f3f4f6;font-weight:600}
.mcat{font-size:12.5px;font-weight:700}
.dtitle{font-size:21px;font-weight:800;line-height:1.35;margin-bottom:8px}
.ddesc{font-size:13.5px;color:var(--mut);line-height:1.65;margin-bottom:18px}
.sect{font-size:12px;font-weight:700;color:var(--amber);margin-bottom:9px}
.divider{height:1px;background:var(--line);margin:18px 0}

.reviewbox{background:#f8f9fb;border:1px solid var(--line);border-radius:12px;padding:14px}
.reviewbox textarea{width:100%;min-height:82px;border:1px solid var(--line);border-radius:9px;padding:11px;
  font-size:13.5px;line-height:1.6;resize:vertical;background:#fff}
.reviewbox textarea:focus{outline:2px solid var(--amber-l);outline-offset:-1px}
.rfoot{display:flex;align-items:center;gap:10px;margin-top:11px}
.rcount{font-size:12px;color:var(--mut)}
.rcount b{color:var(--amber)}
.rdone{font-size:12.5px;font-weight:700;color:var(--che);margin-left:auto}
.savebtn{padding:10px 18px;background:var(--amber);color:#fff;border-radius:9px;font-size:13px;font-weight:700}
.savebtn:disabled{background:#e5e7eb;color:#9ca3af;cursor:not-allowed}
.rfoot .savebtn{margin-left:auto}
.rfoot .rdone + .savebtn{margin-left:0}

.qtitle{font-size:14px;font-weight:700;margin:16px 0 9px}
.opt{width:100%;display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:8px;font-size:13.5px;font-weight:600;text-align:left;background:#fff}
.opt:hover{border-color:#c7cbd3}
.opt .mark{width:21px;height:21px;border-radius:50%;border:2px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.opt.right{background:#f0fdf4;border-color:var(--ok)}
.opt.right .mark{background:var(--ok);border-color:var(--ok)}
.opt.wrong{background:#fef2f2;border-color:var(--no)}
.opt.wrong .mark{background:var(--no);border-color:var(--no)}
.result{text-align:center;padding:14px;border-radius:10px;font-size:13.5px;font-weight:700;margin-top:6px}
.result.pass{background:#f0fdf4;color:var(--ok)}
.result.fail{background:#fef2f2;color:var(--no)}

.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#1f2937;color:#fff;
  padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:90;white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,.2)}

/* ---------- 교사 패널 ---------- */
.adminbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pbtn{padding:9px 15px;border-radius:9px;font-size:13px;font-weight:700;background:var(--amber);color:#fff}
.pbtn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.pbtn.danger{background:#fff;border:1px solid #fecaca;color:var(--no)}
.alist{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.arow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
.arow:last-child{border-bottom:0}
.arow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.arow .c{font-size:11.5px;font-weight:700;flex:none}
.arow .lk{font-size:11px;padding:3px 7px;border-radius:5px;flex:none}
.lk.yes{background:#f0fdf4;color:var(--ok)}
.lk.no{background:#fef2f2;color:var(--no)}
.arow .mini{padding:5px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:#fff;flex:none}
.f{margin-bottom:13px}
.f label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
.f .hint{font-size:11.5px;color:var(--mut);font-weight:400;line-height:1.5;margin-top:4px}
.f input[type=text],.f input[type=url],.f textarea,.f select{width:100%;border:1px solid var(--line);
  border-radius:9px;padding:10px;font-size:13.5px;background:#fff}
.f textarea{min-height:80px;resize:vertical;line-height:1.6}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qbox{border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:11px;background:#f9fafb}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.qhead b{font-size:12.5px}
.optrow{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.optrow input[type=radio]{width:17px;height:17px;flex:none;accent-color:var(--ok)}
.optrow input[type=text]{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff}
.note{background:var(--amber-bg);border:1px solid #fde68a;border-radius:10px;padding:12px 14px;
  font-size:12.5px;line-height:1.7;color:#92400e;margin-bottom:14px}
.note code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:11.5px}
.uid{font-family:ui-monospace,monospace;font-size:11.5px;word-break:break-all}
</style>
</head>
<body>

<!-- ========== 로그인 ========== -->
<div id="login">
  <div class="loginbox">
    <div class="logo">🧭</div>
    <h1>과학 나침반</h1>
    <p>보고 · 풀고 · 방향 찾기<br>학교 구글 계정으로 로그인해 주세요.</p>
    <button class="gbtn" id="gbtn">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.6-.15-3.15-.42-4.65H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.6 5.9c4.44-4.1 7.22-10.14 7.22-17.45z"/><path fill="#FBBC05" d="M10.4 28.7c-.48-1.45-.76-2.99-.76-4.7s.28-3.25.76-4.7l-7.8-6.1C.92 16.46 0 20.12 0 24s.92 7.54 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.6-5.9c-2.12 1.43-4.85 2.27-8.3 2.27-6.3 0-11.7-3.7-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      구글 계정으로 로그인
    </button>
    <div class="loginnote">학교 계정(<b>@sen.go.kr</b>)만 이용할 수 있습니다.</div>
    <div class="err" id="loginerr" hidden></div>
  </div>
</div>

<!-- ========== 앱 ========== -->
<div id="app" hidden>
  <header>
    <div class="hwrap">
      <div class="brand">
        <span class="ic">🧭</span>
        <h1>과학 나침반</h1>
        <span class="sub">보고 · 풀고 · 방향 찾기</span>
      </div>
      <div class="gauge">
        <span class="bolt">⚡</span>
        <span class="num" id="enum">0</span>
        <div class="slots" id="slots"></div>
        <div class="gtext">간식까지<b id="left">5개</b></div>
      </div>
      <button class="hbtn tch" id="adminbtn" hidden>교사 모드</button>
      <button class="hbtn" id="outbtn">로그아웃</button>
    </div>
  </header>
  <main>
    <div class="filters" id="filters"></div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="ver">build 2.1</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, onSnapshot, writeBatch }
  from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCC90U8M-mXTPqNiP4Msi5oyTpB4F-G_rs",
  authDomain: "science-compass-app.firebaseapp.com",
  projectId: "science-compass-app",
  storageBucket: "science-compass-app.firebasestorage.app",
  messagingSenderId: "60584505992",
  appId: "1:60584505992:web:02cd84c334b183a5a9653d"
};
const ALLOW_DOMAIN = "sen.go.kr";

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

/* ===== 분야 ===== */
const CATS = {
  "물리":     { key:"물리",     color:"#2563eb", g:["#1d4ed8","#3b82f6"] },
  "화학":     { key:"화학",     color:"#7c3aed", g:["#6d28d9","#a855f7"] },
  "생명":     { key:"생명",     color:"#059669", g:["#047857","#10b981"] },
  "지구·우주":{ key:"지구·우주", color:"#0d9488", g:["#0f766e","#14b8a6"] },
  "기술·공학":{ key:"기술·공학", color:"#ea580c", g:["#c2410c","#f97316"] }
};
const CATLIST = Object.keys(CATS);
const catColor = c => (CATS[c] ? CATS[c].color : "#6b7280");
const catGrad  = c => { const x = CATS[c] ? CATS[c].g : ["#6b7280","#9ca3af"];
  return "linear-gradient(135deg," + x[0] + "," + x[1] + ")"; };

/* ===== 상태 ===== */
let ME = null;           // {uid,email,name}
let IS_TEACHER = false;
let CONTENTS = [];
let LOGS = {};           // contentId -> log
let PROFILE = { energy:0, totalEnergy:0, snacks:0 };
let FILTER = "전체";
let OPEN_ID = null;

/* ===== 유틸 ===== */
const $  = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

let toastTimer = null;
function toast(msg, ms){
  const root = $("#toastRoot");
  root.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ root.innerHTML = ""; }, ms || 2200);
}

// 유튜브 URL/ID에서 11자리 ID 추출
function ytId(v){
  if(!v) return "";
  const s = String(v).trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  const m = s.match(/(?:v=|\/embed\/|youtu\.be\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : "";
}

/* ===== 로그인 ===== */
$("#gbtn").addEventListener("click", async function(){
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try {
    await signInWithPopup(auth, provider);
  } catch(e){
    showLoginError("로그인에 실패했습니다. (" + e.code + ")");
  }
});
$("#outbtn").addEventListener("click", function(){ signOut(auth); location.reload(); });

function showLoginError(msg){
  const el = $("#loginerr"); el.textContent = msg; el.hidden = false;
}

onAuthStateChanged(auth, async function(user){
  if(!user){ $("#login").hidden = false; $("#app").hidden = true; return; }
  const email = (user.email || "").toLowerCase();
  if(!email.endsWith("@" + ALLOW_DOMAIN) && !email.endsWith("." + ALLOW_DOMAIN)){
    await signOut(auth);
    showLoginError("학교 계정(@" + ALLOW_DOMAIN + ")으로만 이용할 수 있습니다.\n입력한 계정: " + email);
    return;
  }
  ME = { uid:user.uid, email:email, name:user.displayName || email.split("@")[0] };
  $("#login").hidden = true;
  $("#app").hidden = false;
  await boot();
});

/* ===== 부팅 ===== */
async function boot(){
  // 교사 여부
  try {
    const t = await getDoc(doc(db, "teachers", ME.email));
    IS_TEACHER = t.exists();
  } catch(e){ IS_TEACHER = false; }
  $("#adminbtn").hidden = !IS_TEACHER;
  $("#adminbtn").addEventListener("click", openAdmin);

  // 학생 프로필
  const pref = doc(db, "students", ME.uid);
  const psnap = await getDoc(pref);
  if(psnap.exists()){
    const d = psnap.data();
    PROFILE = { energy:d.energy||0, totalEnergy:d.totalEnergy||0, snacks:d.snacks||0 };
  } else {
    await setDoc(pref, { name:ME.name, email:ME.email, energy:0, totalEnergy:0, snacks:0,
      createdAt:Date.now(), updatedAt:Date.now() });
  }

  // 기존 로그
  const ls = await getDocs(collection(db, "students", ME.uid, "logs"));
  ls.forEach(function(d){ LOGS[d.id] = d.data(); });

  renderFilters();
  renderGauge();

  // 콘텐츠 실시간 구독
  onSnapshot(collection(db, "contents"), function(snap){
    const arr = [];
    snap.forEach(function(d){ const o = d.data(); o.id = d.id; arr.push(o); });
    arr.sort(function(a,b){
      const ai = CATLIST.indexOf(a.category), bi = CATLIST.indexOf(b.category);
      if(ai !== bi) return ai - bi;
      return (a.order||0) - (b.order||0);
    });
    CONTENTS = arr;
    renderGrid();
    if(OPEN_ID && !document.getElementById("mediaFrame")){
      const c = CONTENTS.find(x=>x.id===OPEN_ID); if(c) openDetail(OPEN_ID);
    }
  }, function(err){
    $("#grid").innerHTML = '<div class="empty">콘텐츠를 불러오지 못했습니다.<br>' + esc(err.code) + '</div>';
  });
}

/* ===== 헤더 게이지 ===== */
function renderGauge(){
  $("#enum").textContent = PROFILE.energy;
  let s = "";
  for(let i=0;i<5;i++) s += '<div class="slot' + (i < PROFILE.energy ? " on" : "") + '"></div>';
  $("#slots").innerHTML = s;
  $("#left").textContent = PROFILE.energy >= 5 ? "교환 가능" : (5 - PROFILE.energy) + "개";
}

/* ===== 필터 ===== */
function renderFilters(){
  let h = '<button class="chip rand" data-rand="1">🎲 랜덤 추천</button>';
  h += '<button class="chip sep' + (FILTER==="전체"?" on":"") + '" data-cat="전체"' +
       (FILTER==="전체"?' style="background:var(--amber)"':'') + '>전체</button>';
  CATLIST.forEach(function(c){
    const on = FILTER === c;
    h += '<button class="chip' + (on?" on":"") + '" data-cat="' + esc(c) + '"' +
         (on ? ' style="background:' + catColor(c) + '"' : '') + '>' +
         '<span class="dot" style="background:' + catColor(c) + '"></span>' + esc(c) + '</button>';
  });
  const f = $("#filters");
  f.innerHTML = h;
  f.querySelectorAll("[data-cat]").forEach(function(b){
    b.addEventListener("click", function(){ FILTER = b.dataset.cat; renderFilters(); renderGrid(); });
  });
  f.querySelector("[data-rand]").addEventListener("click", function(){
    if(!CONTENTS.length) return;
    const c = CONTENTS[Math.floor(Math.random()*CONTENTS.length)];
    openDetail(c.id);
    toast("오늘의 추천 · " + c.category + " 분야");
  });
}

/* ===== 카드 그리드 ===== */
function visible(){ return FILTER === "전체" ? CONTENTS : CONTENTS.filter(c => c.category === FILTER); }

function renderGrid(){
  const list = visible();
  $("#count").textContent = FILTER + " · 콘텐츠 " + list.length + "개";
  if(!CONTENTS.length){
    $("#grid").innerHTML = '<div class="empty">등록된 콘텐츠가 없습니다.' +
      (IS_TEACHER ? '<br>교사 모드에서 기본 콘텐츠를 불러오거나 새로 추가해 주세요.' : '<br>선생님이 콘텐츠를 준비 중입니다.') +
      '</div>';
    return;
  }
  $("#grid").innerHTML = list.map(cardHTML).join("");
  $("#grid").querySelectorAll(".card").forEach(function(el){
    el.addEventListener("click", function(e){
      if(e.target.closest(".star")) return;
      openDetail(el.dataset.id);
    });
  });
  $("#grid").querySelectorAll(".star").forEach(function(el){
    el.addEventListener("click", function(e){ e.stopPropagation(); toggleScrap(el.dataset.id); });
  });
}

function cardHTML(c){
  const isV = c.type === "video";
  const log = LOGS[c.id] || {};
  const cs = (c.careers || []);
  let tags = cs.slice(0,2).map(function(t){
    return '<span class="ctag" style="background:' + catColor(c.category) + '14;color:' + catColor(c.category) + '">' +
           '<span class="dot" style="background:' + catColor(c.category) + '"></span>' + esc(t) + '</span>';
  }).join("");
  if(cs.length > 2) tags += '<span class="ctag more">+' + (cs.length-2) + '</span>';
  const shot = (isV && c.youtubeId)
    ? '<img src="https://i.ytimg.com/vi/' + encodeURIComponent(c.youtubeId) + '/hqdefault.jpg" ' +
      'alt="" loading="lazy" onerror="this.remove()">' +
      '<span class="pm"><i>▶</i></span>'
    : "";
  return '<article class="card" data-id="' + esc(c.id) + '">' +
    '<div class="thumb" style="background:' + catGrad(c.category) + '">' +
      (shot ? "" : (isV ? "🎬" : "📰")) + shot +
      '<span class="badge">' + (isV ? "▶ 영상" : "📄 기사") + '</span>' +
    '</div>' +
    '<div class="cbody">' +
      '<div class="crow">' +
        '<span class="ccat" style="color:' + catColor(c.category) + '">' + esc(c.category) + '</span>' +
        '<button class="star' + (log.scrapped ? " on" : "") + '" data-id="' + esc(c.id) + '">' +
          (log.scrapped ? "★" : "☆") + '</button>' +
      '</div>' +
      '<h3 class="ctitle">' + esc(c.title) + '</h3>' +
      '<p class="cdesc">' + esc(c.desc) + '</p>' +
      '<div class="careers">' + tags + '</div>' +
    '</div></article>';
}

/* ===== 로그 저장 ===== */
async function saveLog(id, patch){
  const base = LOGS[id] || {};
  const c = CONTENTS.find(x => x.id === id) || {};
  const merged = Object.assign({
    title: c.title || "", category: c.category || "", type: c.type || "",
    scrapped:false, review:"", quizCorrect:0, quizTotal:0, passed:false,
    energyAwarded:false, viewedAt: base.viewedAt || Date.now()
  }, base, patch, { updatedAt: Date.now() });
  LOGS[id] = merged;
  try { await setDoc(doc(db, "students", ME.uid, "logs", id), merged, { merge:true }); }
  catch(e){ console.warn("log save failed", e); }
}

async function saveProfile(){
  try {
    await setDoc(doc(db, "students", ME.uid),
      { name:ME.name, email:ME.email, energy:PROFILE.energy, totalEnergy:PROFILE.totalEnergy,
        snacks:PROFILE.snacks, updatedAt:Date.now() }, { merge:true });
  } catch(e){ console.warn("profile save failed", e); }
}

async function toggleScrap(id){
  const cur = (LOGS[id] && LOGS[id].scrapped) || false;
  await saveLog(id, { scrapped: !cur });
  renderGrid();
  if(OPEN_ID === id) syncModalStar();
  toast(!cur ? "스크랩했습니다" : "스크랩을 해제했습니다", 1400);
}

async function awardIfDone(id){
  const log = LOGS[id] || {};
  const reviewOK = (log.review || "").trim().length >= 15;
  if(reviewOK && log.passed && !log.energyAwarded){
    await saveLog(id, { energyAwarded:true, completedAt: Date.now() });
    PROFILE.energy += 1;
    PROFILE.totalEnergy += 1;
    if(PROFILE.energy >= 5){
      PROFILE.energy = 0;
      PROFILE.snacks += 1;
      await saveProfile(); renderGauge();
      toast("🍪 간식 교환 가능! 에너지 5개를 모았어요", 3000);
      return;
    }
    await saveProfile(); renderGauge();
    toast("⚡ 에너지 +1 충전!", 2400);
  }
}


/* ===== 미디어 (앱 내부 재생 / 읽기) ===== */
function renderMedia(c){
  const box = $("#mediaBox");
  if(!box) return;
  const isV = c.type === "video";
  const hasSrc = isV ? !!c.youtubeId : !!(c.url || c.excerpt);
  const shot = (isV && c.youtubeId)
    ? '<img src="https://i.ytimg.com/vi/' + encodeURIComponent(c.youtubeId) + '/hqdefault.jpg" ' +
      'alt="" onerror="this.remove()">'
    : "";
  box.innerHTML =
    '<div class="hero' + (hasSrc ? " clickable" : "") + '" id="heroBox" style="background:' + catGrad(c.category) + '">' +
      (shot ? "" : (isV ? "🎬" : "📰")) + shot +
      '<span class="badge">' + (isV ? "▶ 영상" : "📄 기사") + '</span>' +
      (hasSrc ? '<span class="playmark"><i>' + (isV ? "▶" : "📖") + '</i></span>' : "") +
    '</div>' +
    (hasSrc
      ? '<button class="openbtn" id="openLink">' + (isV ? "▶ 영상 보기" : "📄 기사 읽기") + '</button>'
      : '<div class="notice">아직 ' + (isV ? "영상 주소" : "기사 주소") + '가 등록되지 않았습니다.<br>' +
        '교사 모드 → 이 콘텐츠 <b>수정</b>에서 주소를 넣어 주세요.</div>');
  if(!hasSrc) return;
  function start(){ if(isV) showVideo(c, false); else showArticle(c); }
  $("#openLink").addEventListener("click", start);
  $("#heroBox").addEventListener("click", start);
}

function showVideo(c, alt){
  const host = alt ? "https://www.youtube.com" : "https://www.youtube-nocookie.com";
  const src = host + "/embed/" + encodeURIComponent(c.youtubeId) +
              "?rel=0&modestbranding=1&playsinline=1&autoplay=1";
  $("#mediaBox").innerHTML =
    '<div class="framewrap">' +
      '<iframe id="mediaFrame" src="' + src + '" title="영상" ' +
      'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" ' +
      'referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>' +
    '</div>' +
    '<div class="linkbar">' +
      '<button id="mClose">■ 닫기</button>' +
      '<button id="ytAlt">' + (alt ? "기본 방식으로 재생" : "화면이 검으면 → 다른 방식으로 재생") + '</button>' +
      '<a href="https://www.youtube.com/watch?v=' + encodeURIComponent(c.youtubeId) + '" target="_blank" rel="noopener">유튜브에서 열기</a>' +
      '<span class="tipx">둘 다 안 되면 업로더가 외부 재생을 막아 둔 영상입니다.</span>' +
    '</div>';
  $("#mClose").addEventListener("click", function(){ renderMedia(c); });
  $("#ytAlt").addEventListener("click", function(){ showVideo(c, !alt); });
}

function showArticle(c){
  const mode = c.readMode || "auto";
  if(mode === "excerpt" || !c.url) showExcerpt(c);
  else showArticleFrame(c);
}

function showArticleFrame(c){
  $("#mediaBox").innerHTML =
    '<div class="framewrap tall">' +
      '<iframe id="mediaFrame" src="' + esc(c.url) + '" title="기사" ' +
      'referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>' +
      '<div class="fallback" id="artWait">기사를 불러오는 중입니다…</div>' +
    '</div>' +
    '<div class="linkbar">' +
      '<button id="mClose">■ 닫기</button>' +
      (c.excerpt ? '<button id="toEx">앱에서 안 열려요 → 발췌 읽기</button>' : '') +
      '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">원문 새 탭에서 열기</a>' +
    '</div>';
  const fr = $("#mediaFrame");
  let loaded = false;
  fr.addEventListener("load", function(){
    loaded = true;
    const w = $("#artWait");
    if(w && w.parentNode) w.parentNode.removeChild(w);
  });
  setTimeout(function(){
    if(loaded) return;
    const w = $("#artWait");
    if(!w) return;
    w.innerHTML = '이 기사는 언론사가 외부 삽입을 막아 둔 것 같습니다.' +
      (c.excerpt ? '<br>잠시 후 교사가 정리한 <b>발췌</b>로 넘어갑니다.'
                 : '<br>아래 <b>원문 새 탭에서 열기</b>를 눌러 주세요.');
    if(c.excerpt) setTimeout(function(){ if(!loaded) showExcerpt(c); }, 1800);
  }, 4500);
  $("#mClose").addEventListener("click", function(){ renderMedia(c); });
  const bx = $("#toEx");
  if(bx) bx.addEventListener("click", function(){ showExcerpt(c); });
}

function showExcerpt(c){
  const text = (c.excerpt || "").trim();
  const body = text
    ? text.split(/\n+/).map(function(p){ return '<p>' + esc(p) + '</p>'; }).join("")
    : '<p style="color:#6b7280">아직 발췌문이 등록되지 않았습니다. 아래 원문 링크로 읽어 주세요.</p>';
  $("#mediaBox").innerHTML =
    '<div class="reader"><div class="readernote">📄 기사 발췌 · 선생님이 정리한 내용입니다</div>' + body + '</div>' +
    '<div class="linkbar">' +
      '<button id="mClose">■ 닫기</button>' +
      (c.url ? '<button id="toFrame">앱 안에서 원문 열어보기</button>' : '') +
      (c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">원문 새 탭에서 열기</a>' : '') +
    '</div>';
  $("#mClose").addEventListener("click", function(){ renderMedia(c); });
  const bf = $("#toFrame");
  if(bf) bf.addEventListener("click", function(){ showArticleFrame(c); });
}

/* ===== 상세 모달 ===== */
function openDetail(id){
  const c = CONTENTS.find(x => x.id === id);
  if(!c) return;
  OPEN_ID = id;
  const log = LOGS[id] || {};
  if(!log.viewedAt) saveLog(id, { viewedAt: Date.now() });

  const isV = c.type === "video";
  const link = isV ? ("https://www.youtube.com/watch?v=" + (c.youtubeId||"")) : (c.url || "");
  const cs = (c.careers || []);
  const careerHTML = cs.map(function(t){
    return '<span class="ctag" style="background:' + catColor(c.category) + '14;color:' + catColor(c.category) + '">' +
           '<span class="dot" style="background:' + catColor(c.category) + '"></span>' + esc(t) + '</span>';
  }).join("");

  const quiz = c.quiz || [];
  let quizHTML = "";
  if(quiz.length){
    quizHTML = '<div class="divider"></div><div class="sect">이해 퀴즈 · ' + quiz.length +
      '문제 (정답 60% 이상이면 통과)</div><div id="quizWrap">' +
      quiz.map(function(q, qi){
        return '<div class="qtitle">' + (qi+1) + '. ' + esc(q.q) + '</div>' +
          (q.options||[]).map(function(o, oi){
            return '<button class="opt" data-q="' + qi + '" data-o="' + oi + '">' +
                   '<span class="mark"></span>' + esc(o) + '</button>';
          }).join("");
      }).join("") +
      '</div><div id="quizResult"></div>';
  }

  $("#modalRoot").innerHTML =
   '<div class="back" id="back"><div class="sheet"><div class="shead">' +
     '<button class="iconbtn" id="closeBtn">←</button>' +
     '<button class="iconbtn" id="starBtn">' + (log.scrapped ? "★" : "☆") + '</button>' +
   '</div><div class="sbody">' +
     '<div class="mediabox" id="mediaBox"></div>' +
     '<div class="metarow"><span class="mtag">' + (isV ? "▶ 영상" : "📄 기사") + '</span>' +
       '<span class="mcat" style="color:' + catColor(c.category) + '">' + esc(c.category) + '</span></div>' +
     '<h2 class="dtitle">' + esc(c.title) + '</h2>' +
     '<p class="ddesc">' + esc(c.desc) + '</p>' +
     '<div class="sect">이 콘텐츠와 이어지는 진로</div>' +
     '<div class="careers">' + careerHTML + '</div>' +
     '<div class="sect" style="margin-top:18px">한 줄 감상</div>' +
     '<div class="reviewbox">' +
       '<textarea id="review" placeholder="보고 나서 든 생각을 한 줄 남겨보세요. (최소 15자)">' + esc(log.review||"") + '</textarea>' +
       '<div class="rfoot">' +
         '<span class="rcount"><b id="rn">' + (log.review||"").length + '</b> / 최소 15자</span>' +
         '<span class="rdone" id="rdone"' + (log.review ? '' : ' hidden') + '>✓ 감상 완료</span>' +
         '<button class="savebtn" id="rsave">' + (log.review ? "저장됨" : "감상 남기기") + '</button>' +
       '</div></div>' +
     quizHTML +
   '</div></div></div>';

  $("#closeBtn").addEventListener("click", closeDetail);
  $("#back").addEventListener("click", function(e){ if(e.target.id === "back") closeDetail(); });
  $("#starBtn").addEventListener("click", function(){ toggleScrap(id); });
  renderMedia(c);

  const ta = $("#review"), sv = $("#rsave");
  function syncReview(){
    const n = ta.value.trim().length;
    $("#rn").textContent = n;
    sv.disabled = n < 15;
    if(sv.textContent === "저장됨" && n !== (LOGS[id] && LOGS[id].review ? LOGS[id].review.length : 0))
      sv.textContent = "감상 남기기";
  }
  ta.addEventListener("input", syncReview);
  syncReview();
  sv.addEventListener("click", async function(){
    const v = ta.value.trim();
    if(v.length < 15) return;
    await saveLog(id, { review: v });
    sv.textContent = "저장됨";
    $("#rdone").hidden = false;
    toast("감상 완료! 퀴즈까지 풀면 ⚡ 에너지를 받아요", 2600);
    awardIfDone(id);
  });

  if(quiz.length) setupQuiz(id, c);
}

function syncModalStar(){
  const b = document.getElementById("starBtn");
  if(b && OPEN_ID) b.textContent = (LOGS[OPEN_ID] && LOGS[OPEN_ID].scrapped) ? "★" : "☆";
}

function closeDetail(){ OPEN_ID = null; $("#modalRoot").innerHTML = ""; }

function setupQuiz(id, c){
  const quiz = c.quiz || [];
  const picked = {};
  const wrap = $("#quizWrap");
  if(!wrap) return;
  wrap.querySelectorAll(".opt").forEach(function(btn){
    btn.addEventListener("click", function(){
      const qi = Number(btn.dataset.q), oi = Number(btn.dataset.o);
      if(picked[qi] !== undefined) return;
      picked[qi] = oi;
      const ans = quiz[qi].answer;
      wrap.querySelectorAll('.opt[data-q="' + qi + '"]').forEach(function(b2){
        const k = Number(b2.dataset.o);
        if(k === ans){ b2.classList.add("right"); b2.querySelector(".mark").textContent = "✓"; }
        else if(k === oi){ b2.classList.add("wrong"); b2.querySelector(".mark").textContent = "✕"; }
      });
      if(Object.keys(picked).length === quiz.length) finishQuiz();
    });
  });
  async function finishQuiz(){
    let correct = 0;
    quiz.forEach(function(q, i){ if(picked[i] === q.answer) correct++; });
    const pass = (correct / quiz.length) >= 0.6;
    $("#quizResult").innerHTML = '<div class="result ' + (pass ? "pass" : "fail") + '">' +
      (pass ? "✓ 통과 · 정답 " : "다시 도전 · 정답 ") + correct + "/" + quiz.length + '</div>';
    await saveLog(id, { quizCorrect:correct, quizTotal:quiz.length, passed:pass });
    awardIfDone(id);
  }
}

  $("#modalRoot").innerHTML =
   '<div class="back" id="aback"><div class="sheet wide">' +
     '<div class="shead"><h3>교사 모드 · 콘텐츠 관리</h3>' +
       '<button class="iconbtn" id="aclose">✕</button></div>' +
     '<div class="sbody" id="abody"></div>' +
   '</div></div>';
  $("#aclose").addEventListener("click", function(){ $("#modalRoot").innerHTML = ""; });
  $("#aback").addEventListener("click", function(e){ if(e.target.id === "aback") $("#modalRoot").innerHTML = ""; });
  renderAdminList();
}

    return '<div class="arow">' +
      '<span class="c" style="color:' + catColor(c.category) + '">' + esc(c.category) + '</span>' +
      '<span class="t">' + (c.type==="video"?"▶ ":"📄 ") + esc(c.title) + '</span>' +
      '<span class="lk ' + (linked?"yes":"no") + '">' + (linked ? "연결됨" : "미연결") + '</span>' +
      '<button class="mini" data-edit="' + esc(c.id) + '">수정</button>' +
      '<button class="mini" data-del="' + esc(c.id) + '">삭제</button>' +
    '</div>';
  }).join("");
  if(!rows) rows = '<div class="arow" style="color:#6b7280">등록된 콘텐츠가 없습니다.</div>';

function qBlock(i, q){
  const opts = (q && q.options) ? q.options : ["","","",""];
  const ans  = (q && typeof q.answer === "number") ? q.answer : 0;
  let h = '<div class="qbox" data-qi="' + i + '">' +
    '<div class="qhead"><b>문제 ' + (i+1) + '</b>' +
      '<button class="mini" data-rmq="' + i + '">삭제</button></div>' +
    '<div class="f"><input type="text" class="q-text" placeholder="질문을 입력하세요" value="' +
      esc(q ? q.q : "") + '"></div>';
  for(let k=0;k<4;k++){
    h += '<div class="optrow">' +
      '<input type="radio" name="ans' + i + '" value="' + k + '"' + (ans===k?" checked":"") + '>' +
      '<input type="text" class="q-opt" placeholder="보기 ' + (k+1) + '" value="' + esc(opts[k]||"") + '">' +
    '</div>';
  }
  h += '<div class="hint" style="font-size:11.5px;color:#6b7280">왼쪽 동그라미를 선택한 보기가 정답입니다.</div></div>';
  return h;
}

async function seedContents(){
  if(!confirm("기본 콘텐츠 15개를 등록할까요?\n(같은 ID가 있으면 덮어씁니다)")) return;
  const batch = writeBatch(db);
  SEED.forEach(function(c, i){
    const o = Object.assign({}, c, { order:i, updatedAt:Date.now(), updatedBy:ME.email });
    const id = o.id; delete o.id;
    batch.set(doc(db, "contents", id), o, { merge:true });
  });
  try {
    await batch.commit();
    toast("기본 콘텐츠를 등록했습니다", 2000);
    setTimeout(renderAdminList, 500);
  } catch(e){ alert("등록 실패: " + e.code); }
}
