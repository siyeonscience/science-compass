<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과학 나침반 — 2단계 프로토타입</title>
<style>
  :root{
    --bg:#f2f4fb;
    --surface:#ffffff;
    --fg:#1a1d29;
    --mut:#6b7280;
    --line:#e5e7ef;
    --amber:#e0942a;
    --amber-dark:#c87f1c;
    --radius:14px;
    --shadow:0 1px 2px rgba(17,24,39,.06), 0 6px 16px rgba(17,24,39,.05);

    --c-physics:#2563eb;
    --c-chem:#7c3aed;
    --c-bio:#16a34a;
    --c-earth:#0d9488;
    --c-tech:#ea580c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--fg); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  textarea{font:inherit}

  /* ---------- header ---------- */
  header{
    background:var(--surface); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:30;
  }
  .hd-in{
    max-width:1280px; margin:0 auto; padding:12px 24px;
    display:flex; align-items:center; gap:12px;
  }
  .logo{
    width:34px;height:34px;border-radius:10px;flex:none;
    background:var(--amber); color:#fff; font-size:17px;
    display:flex;align-items:center;justify-content:center;
  }
  .brand{display:flex; align-items:baseline; gap:6px; min-width:0}
  .brand h1{font-size:20px; font-weight:800; letter-spacing:-.02em; white-space:nowrap}
  .brand .sub{font-size:12px; color:var(--mut); white-space:nowrap}
  .energy{margin-left:auto; display:flex; align-items:center; gap:10px}
  .energy .bolt{font-size:15px}
  .energy .num{font-size:14px; font-weight:700; color:var(--mut); min-width:12px}
  .slots{display:flex; gap:4px}
  .slot{width:20px;height:24px;border-radius:5px;background:#eceef4;transition:background .25s}
  .slot.on{background:var(--amber)}
  .goal{font-size:11px; color:var(--mut); text-align:right; line-height:1.25}
  .goal b{display:block; font-size:12px; color:var(--fg)}

  /* ---------- filter bar ---------- */
  .filters{max-width:1280px; margin:0 auto; padding:20px 24px 4px}
  .chips{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
  .chip{
    border:1px solid var(--line); background:var(--surface);
    border-radius:10px; padding:9px 16px; font-size:14px; font-weight:600;
    display:inline-flex; align-items:center; gap:7px; transition:.15s;
  }
  .chip:hover{border-color:#cdd2e0}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .chip.all{color:var(--amber-dark); border-color:#f0d9b4}
  .chip[aria-pressed="true"]{color:#fff; border-color:transparent}
  .chip.all[aria-pressed="true"]{background:var(--amber); color:#fff}
  .chip[data-cat="physics"][aria-pressed="true"]{background:var(--c-physics)}
  .chip[data-cat="chem"][aria-pressed="true"]{background:var(--c-chem)}
  .chip[data-cat="bio"][aria-pressed="true"]{background:var(--c-bio)}
  .chip[data-cat="earth"][aria-pressed="true"]{background:var(--c-earth)}
  .chip[data-cat="tech"][aria-pressed="true"]{background:var(--c-tech)}
  .chip[aria-pressed="true"] .dot{background:#fff}
  .btn-random{
    background:var(--amber); color:#fff; border-radius:12px;
    padding:12px 18px; font-size:15px; font-weight:700;
    display:inline-flex; align-items:center; gap:8px;
    box-shadow:0 2px 6px rgba(224,148,42,.35); margin-right:6px;
  }
  .btn-random:hover{background:var(--amber-dark)}
  .count{max-width:1280px;margin:0 auto;padding:14px 24px 0;font-size:13px;color:var(--mut)}

  /* ---------- grid ---------- */
  .grid{
    max-width:1280px; margin:0 auto; padding:16px 24px 48px;
    display:grid; gap:20px; grid-template-columns:repeat(auto-fill,minmax(248px,1fr));
  }
  .card{
    background:var(--surface); border-radius:var(--radius); overflow:hidden;
    box-shadow:var(--shadow); display:flex; flex-direction:column;
    cursor:pointer; transition:transform .15s, box-shadow .15s;
  }
  .card:hover{transform:translateY(-2px); box-shadow:0 4px 10px rgba(17,24,39,.08),0 12px 28px rgba(17,24,39,.08)}
  .thumb{
    aspect-ratio:16/10; position:relative;
    display:flex; align-items:center; justify-content:center; font-size:38px;
  }
  .thumb.physics{background:linear-gradient(140deg,#1d4ed8,#3b82f6)}
  .thumb.chem{background:linear-gradient(140deg,#6d28d9,#a855f7)}
  .thumb.bio{background:linear-gradient(140deg,#15803d,#22c55e)}
  .thumb.earth{background:linear-gradient(140deg,#0f766e,#14b8a6)}
  .thumb.tech{background:linear-gradient(140deg,#c2410c,#f97316)}
  .badge{
    position:absolute; top:10px; left:10px;
    background:rgba(17,20,32,.78); color:#fff;
    font-size:11px; font-weight:700; padding:4px 9px; border-radius:6px;
  }
  .body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1}
  .body .top{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .cat{font-size:12px; font-weight:700}
  .cat.physics{color:var(--c-physics)} .cat.chem{color:var(--c-chem)}
  .cat.bio{color:var(--c-bio)} .cat.earth{color:var(--c-earth)} .cat.tech{color:var(--c-tech)}
  .star{font-size:16px; color:#c3c8d6; line-height:1; padding:2px}
  .star.on{color:var(--amber)}
  .card h3{font-size:15.5px; font-weight:800; letter-spacing:-.01em; line-height:1.35}
  .desc{
    font-size:12.5px; color:var(--mut); display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .careers{display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; padding-top:6px}
  .career{
    font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:999px;
    background:#f4f5fa; color:#4b5563; display:inline-flex; align-items:center; gap:5px;
  }
  .career .dot{width:5px;height:5px}
  .career.more{color:var(--mut)}
  .empty{grid-column:1/-1; text-align:center; color:var(--mut); font-size:14px; padding:56px 0}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(15,18,30,.45);
    display:none; align-items:center; justify-content:center; z-index:50; padding:24px;
  }
  .overlay.open{display:flex}
  .modal{
    background:var(--surface); width:min(660px,100%); max-height:92vh;
    border-radius:16px; display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 20px 50px rgba(15,18,30,.28);
  }
  .m-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--line); flex:none;
  }
  .icon-btn{
    width:40px;height:40px;border-radius:10px;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:17px;
  }
  .icon-btn:hover{background:#f7f8fc}
  .icon-btn.star.on{color:var(--amber)}
  .m-body{overflow-y:auto; padding:18px}
  .m-thumb{aspect-ratio:16/9; border-radius:12px; position:relative;
    display:flex;align-items:center;justify-content:center;font-size:48px}
  .open-link{
    width:100%; margin-top:12px; background:#f4f5fa; border-radius:10px;
    padding:13px; font-size:14.5px; font-weight:700; text-align:center;
  }
  .open-link:hover{background:#eceef6}
  .m-tags{display:flex; align-items:center; gap:10px; margin-top:18px}
  .tag{font-size:11.5px; font-weight:700; background:#f4f5fa; color:#4b5563; padding:4px 9px; border-radius:6px}
  .m-body h2{font-size:22px; font-weight:800; letter-spacing:-.02em; margin-top:8px}
  .m-desc{font-size:14px; color:#4b5563; margin-top:8px}
  .sec-label{font-size:12.5px; font-weight:700; color:#5b6172; margin-top:20px}
  .m-careers{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}

  .review{background:#fafbff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:8px}
  .review textarea{
    width:100%; min-height:74px; resize:vertical; border:1px solid var(--line);
    border-radius:9px; padding:11px 12px; font-size:13.5px; background:#fff; outline:none;
  }
  .review textarea:focus{border-color:#c9cfe2}
  .review .row{display:flex; align-items:center; gap:12px; margin-top:12px}
  .counter{font-size:12.5px; color:var(--mut)}
  .counter b{color:var(--amber-dark)}
  .done-mark{font-size:12.5px; font-weight:700; color:var(--c-chem)}
  .btn-save{
    margin-left:auto; background:var(--amber); color:#fff; font-weight:700;
    font-size:13.5px; padding:10px 18px; border-radius:9px;
  }
  .btn-save:disabled{background:#e3e5ec; color:#9aa0ae; cursor:not-allowed}

  .quiz{border-top:1px solid var(--line); margin-top:22px; padding-top:18px}
  .quiz .q{font-size:15px; font-weight:800; margin:16px 0 10px}
  .opt{
    width:100%; text-align:left; display:flex; align-items:center; gap:12px;
    border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    font-size:14px; font-weight:600; margin-bottom:10px; background:#fff; transition:.15s;
  }
  .opt:hover:not(:disabled){border-color:#c9cfe2; background:#fafbff}
  .opt .mark{
    width:19px;height:19px;border-radius:50%;border:1.5px solid #cfd4e2; flex:none;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;
  }
  .opt.correct{background:#effaf1; border-color:#7bcf94}
  .opt.correct .mark{background:#22a95a; border-color:#22a95a}
  .opt.wrong{background:#fdf0f0; border-color:#eda3a3}
  .opt.wrong .mark{background:#dc5a5a; border-color:#dc5a5a}
  .opt:disabled{cursor:default}
  .result{
    margin-top:6px; border-radius:10px; padding:14px; text-align:center;
    font-size:14px; font-weight:800;
  }
  .result.pass{background:#effaf1; color:#1c7a45}
  .result.fail{background:#fdf0f0; color:#b44141}

  /* ---------- toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,12px);
    background:#1b1f2e; color:#fff; font-size:13.5px; font-weight:700;
    padding:12px 20px; border-radius:10px; z-index:80;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    box-shadow:0 8px 24px rgba(15,18,30,.3); max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}

  @media (max-width:640px){
    .hd-in{padding:10px 14px; flex-wrap:wrap}
    .brand .sub{display:none}
    .filters,.count,.grid{padding-left:14px;padding-right:14px}
    .goal{display:none}
    .overlay{padding:0}
    .modal{max-height:100vh; border-radius:0; height:100%}
  }
</style>
</head>
<body>

<header>
  <div class="hd-in">
    <div class="logo">&#129517;</div>
    <div class="brand">
      <h1>과학 나침반</h1>
      <span class="sub">보고 &middot; 풀고 &middot; 방향 찾기</span>
    </div>
    <div class="energy">
      <span class="bolt">&#9889;</span>
      <span class="num" id="energyNum">0</span>
      <div class="slots" id="slots"></div>
      <div class="goal"><span>간식까지</span><b id="goalLeft">5개</b></div>
    </div>
  </div>
</header>

<div class="filters">
  <div class="chips">
    <button class="btn-random" id="btnRandom">&#127922; 랜덤 추천</button>
    <button class="chip all" data-cat="all" aria-pressed="true">전체</button>
    <button class="chip" data-cat="physics" aria-pressed="false"><span class="dot" style="background:var(--c-physics)"></span>물리</button>
    <button class="chip" data-cat="chem" aria-pressed="false"><span class="dot" style="background:var(--c-chem)"></span>화학</button>
    <button class="chip" data-cat="bio" aria-pressed="false"><span class="dot" style="background:var(--c-bio)"></span>생명</button>
    <button class="chip" data-cat="earth" aria-pressed="false"><span class="dot" style="background:var(--c-earth)"></span>지구&middot;우주</button>
    <button class="chip" data-cat="tech" aria-pressed="false"><span class="dot" style="background:var(--c-tech)"></span>기술&middot;공학</button>
  </div>
</div>

<div class="count" id="countLine"></div>
<main class="grid" id="grid"></main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <div class="m-head">
      <button class="icon-btn" id="btnBack" aria-label="닫기">&#8592;</button>
      <button class="icon-btn star" id="mStar" aria-label="즐겨찾기">&#9734;</button>
    </div>
    <div class="m-body" id="mBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== 데이터 ===================== */
const CATS = {
  physics:{label:'물리',   color:'var(--c-physics)'},
  chem:   {label:'화학',   color:'var(--c-chem)'},
  bio:    {label:'생명',   color:'var(--c-bio)'},
  earth:  {label:'지구·우주', color:'var(--c-earth)'},
  tech:   {label:'기술·공학', color:'var(--c-tech)'}
};
const GOAL = 5; // 에너지 5개 = 간식 교환

const CONTENTS = [
  { id:'p1', cat:'physics', type:'video',
    title:'상온 초전도체는 왜 세상을 바꿀까?',
    desc:'전기가 저항 없이 흐르면 어떤 일이 생길까? 자기부상열차부터 전력 손실 제로까지, 초전도의 가능성과 한계를 살펴본다.',
    careers:['재료공학자','물리학 연구원','에너지 정책 연구원'],
    quiz:[
      {q:'초전도체의 가장 큰 특징은?', options:['전기 저항이 0이 된다','열을 많이 낸다','스스로 빛을 낸다','무게가 늘어난다'], answer:0},
      {q:'초전도 기술이 쓰일 수 있는 분야는?', options:['자기부상열차와 송전','종이 제작','의류 염색','도자기 굽기'], answer:0}
    ]},
  { id:'p2', cat:'physics', type:'article',
    title:'인류가 처음 찍은 블랙홀 사진의 비밀',
    desc:'지구만 한 망원경이 없는데 어떻게 블랙홀을 촬영했을까? 전 세계 망원경을 하나로 묶은 관측 프로젝트의 이야기.',
    careers:['천체물리학자','데이터 과학자'],
    quiz:[
      {q:'블랙홀 사진은 어떻게 찍었을까?', options:['전 세계 망원경을 하나처럼 연결해서','우주선을 직접 보내서','현미경으로 확대해서','스마트폰 카메라로'], answer:0},
      {q:'이 관측에 반드시 필요했던 것은?', options:['방대한 데이터 처리 기술','심해 잠수정','인공 강우 장치','고성능 조명'], answer:0}
    ]},
  { id:'p3', cat:'physics', type:'video',
    title:'롤러코스터 한 바퀴에 숨은 에너지 이야기',
    desc:'첫 언덕만 높으면 나머지는 저절로 돈다? 위치·운동 에너지 전환으로 놀이기구의 설계 원리를 읽어본다.',
    careers:['놀이기구 설계 엔지니어','기계공학자'],
    quiz:[
      {q:'첫 번째 언덕이 가장 높은 이유는?', options:['위치 에너지를 최대로 저장하려고','사진을 찍기 좋아서','바람을 막으려고','소리를 키우려고'], answer:0},
      {q:'내려갈 때 위치 에너지는 무엇으로 바뀔까?', options:['운동 에너지','핵 에너지','화학 에너지','빛 에너지'], answer:0}
    ]},

  { id:'c1', cat:'chem', type:'video',
    title:'라면 스프에 숨어 있는 화학',
    desc:'감칠맛의 정체는 무엇일까? 아미노산과 맛 분자의 세계, 그리고 "맛을 설계하는" 사람들의 일.',
    careers:['식품공학자','향미 연구원'],
    quiz:[
      {q:'감칠맛을 내는 대표 성분은?', options:['글루탐산','탄산칼슘','염화은','포도당'], answer:0},
      {q:'식품공학자가 하는 일에 가까운 것은?', options:['맛과 향을 분자 수준에서 설계한다','다리를 설계한다','별을 관측한다','지진을 예보한다'], answer:0}
    ]},
  { id:'c2', cat:'chem', type:'article',
    title:'플라스틱을 먹어치우는 효소가 나타났다',
    desc:'수백 년 썩지 않는 플라스틱을 몇 시간 만에 분해하는 효소를 과학자들이 개량하고 있다. 환경 문제를 화학으로 푸는 최전선.',
    careers:['환경화학자','생명공학 연구원'],
    quiz:[
      {q:'기사에 나온 효소가 하는 일은?', options:['플라스틱을 분해한다','플라스틱을 새로 만든다','색을 입힌다','더 단단하게 만든다'], answer:0},
      {q:'이 기술이 도움이 되는 문제는?', options:['환경 오염','교통 체증','수면 부족','통신 장애'], answer:0}
    ]},
  { id:'c3', cat:'chem', type:'video',
    title:'불꽃놀이 색깔은 어떻게 만들까',
    desc:'빨강·초록·파랑… 밤하늘의 색은 우연이 아니다. 금속마다 다른 불꽃 반응으로 색을 설계하는 법.',
    careers:['화학 연구원','화공 엔지니어'],
    quiz:[
      {q:'불꽃의 색을 결정하는 것은?', options:['금속 원소의 종류','발사 각도','화약의 양','밤하늘의 온도'], answer:0},
      {q:'빨간색 불꽃에 주로 쓰이는 원소는?', options:['스트론튬','나트륨','구리','바륨'], answer:0}
    ]},

  { id:'b1', cat:'bio', type:'video',
    title:'내 몸속에 사는 100조 마리 미생물',
    desc:'장 속 미생물이 기분과 면역까지 좌우한다고? 인간과 미생물의 공생 관계, 그리고 그 연구가 열어준 길.',
    careers:['미생물학자','제약 연구원'],
    quiz:[
      {q:'장내 미생물이 영향을 준다고 알려진 것은?', options:['면역과 기분','시력','머리카락 색','키'], answer:0},
      {q:'사람과 장내 미생물의 관계는?', options:['서로 도움을 주고받는 공생','일방적인 기생','완전히 무관함','경쟁만 하는 관계'], answer:0}
    ]},

    careers:['토목공학자','구조 설계 엔지니어'],
    quiz:[

      {q:'구조 설계에서 중요한 개념은?', options:['안전율을 여유 있게 두는 것','색을 고르는 것','이름을 짓는 것','길이를 줄이는 것'], answer:0}
    ]}
];

/* ===================== 상태 저장 ===================== */
const KEY = 'science-compass-v2';
const load = () => { try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } };
let state = Object.assign({ stars:{}, reviews:{}, quiz:{}, rewarded:{} }, load());
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };

let currentCat = 'all';
let current = null;

/* ===================== 공통 ===================== */
const $ = (s,r) => (r||document).querySelector(s);
const typeLabel = t => t === 'video' ? '\u25B6 영상' : '\uD83D\uDCC4 기사';
const typeEmoji = t => t === 'video' ? '\uD83C\uDFAC' : '\uD83D\uDCF0';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let toastTimer = null;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ===================== 에너지 ===================== */
function energyCount(){ return Object.keys(state.rewarded).length; }
function renderEnergy(){
  const n = energyCount();
  $('#energyNum').textContent = n;
  $('#slots').innerHTML = Array.from({length:GOAL}, (_,i) =>
    '<div class="slot' + (i < n % GOAL || (n >= GOAL && n % GOAL === 0) ? ' on' : '') + '"></div>').join('');
  const left = (GOAL - (n % GOAL)) % GOAL;
  $('#goalLeft').textContent = left === 0 && n > 0 ? '교환 가능' : (GOAL - (n % GOAL)) + '개';
}

/* ===================== 목록 ===================== */
function visible(){ return currentCat === 'all' ? CONTENTS : CONTENTS.filter(c => c.cat === currentCat); }

function renderGrid(){
  const list = visible();
  $('#countLine').textContent =
    (currentCat === 'all' ? '전체' : CATS[currentCat].label) + ' · 콘텐츠 ' + list.length + '개';

  if(!list.length){ $('#grid').innerHTML = '<p class="empty">표시할 콘텐츠가 없습니다.</p>'; return; }

  $('#grid').innerHTML = list.map(c => {
    const shown = c.careers.slice(0,2);
    const more = c.careers.length - shown.length;
    const chips = shown.map(n =>
      '<span class="career"><span class="dot" style="background:' + CATS[c.cat].color + '"></span>' + esc(n) + '</span>'
    ).join('') + (more > 0 ? '<span class="career more">+' + more + '</span>' : '');

    return '' +
      '<article class="card" data-id="' + c.id + '">' +
        '<div class="thumb ' + c.cat + '">' +
          '<span class="badge">' + typeLabel(c.type) + '</span>' + typeEmoji(c.type) +
        '</div>' +
        '<div class="body">' +
          '<div class="top">' +
            '<span class="cat ' + c.cat + '">' + CATS[c.cat].label + '</span>' +
            '<button class="star' + (state.stars[c.id] ? ' on' : '') + '" data-star="' + c.id + '" aria-label="즐겨찾기">' +
              (state.stars[c.id] ? '\u2605' : '\u2606') +
            '</button>' +
          '</div>' +
          '<h3>' + esc(c.title) + '</h3>' +
          '<p class="desc">' + esc(c.desc) + '</p>' +
          '<div class="careers">' + chips + '</div>' +
        '</div>' +
      '</article>';
  }).join('');
}

/* ===================== 상세 모달 ===================== */
function openDetail(id){
  current = CONTENTS.find(c => c.id === id);
  if(!current) return;

  const c = current;
  const review = state.reviews[c.id] || '';
  const saved = review.length >= 15;

  $('#mStar').classList.toggle('on', !!state.stars[c.id]);
  $('#mStar').innerHTML = state.stars[c.id] ? '\u2605' : '\u2606';

  $('#mBody').innerHTML = '' +
    '<div class="m-thumb ' + c.cat + '" style="background:' + thumbBg(c.cat) + '">' +
      '<span class="badge">' + typeLabel(c.type) + '</span>' + typeEmoji(c.type) +
    '</div>' +
    '<button class="open-link" id="openLink">' + (c.type === 'video' ? '\u25B6 영상 보기' : '\uD83D\uDCC4 기사 읽기') + '</button>' +
    '<div class="m-tags">' +
      '<span class="tag">' + typeLabel(c.type) + '</span>' +
      '<span class="cat ' + c.cat + '">' + CATS[c.cat].label + '</span>' +
    '</div>' +
    '<h2 id="mTitle">' + esc(c.title) + '</h2>' +
    '<p class="m-desc">' + esc(c.desc) + '</p>' +
    '<p class="sec-label">이 콘텐츠와 이어지는 진로</p>' +
    '<div class="m-careers">' + c.careers.map(n =>
        '<span class="career"><span class="dot" style="background:' + CATS[c.cat].color + '"></span>' + esc(n) + '</span>').join('') +
    '</div>' +
    '<p class="sec-label">한 줄 감상</p>' +
    '<div class="review">' +
      '<textarea id="reviewText" placeholder="보고 나서 든 생각을 한 줄 남겨보세요. (최소 15자)">' + esc(review) + '</textarea>' +
      '<div class="row">' +
        '<span class="counter"><b id="revLen">' + review.length + '</b> / 최소 15자</span>' +
        '<span class="done-mark" id="revDone" style="display:' + (saved ? 'inline' : 'none') + '">\u2713 감상 완료</span>' +
        '<button class="btn-save" id="btnSave">' + (saved ? '저장됨' : '감상 남기기') + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="quiz">' +
      '<p class="sec-label" style="margin-top:0">이해 퀴즈 · ' + c.quiz.length + '문제 (정답 60% 이상이면 통과)</p>' +
      c.quiz.map((q,qi) =>
        '<p class="q">' + (qi+1) + '. ' + esc(q.q) + '</p>' +
        q.options.map((o,oi) =>
          '<button class="opt" data-q="' + qi + '" data-o="' + oi + '"><span class="mark"></span>' + esc(o) + '</button>').join('')
      ).join('') +
      '<div class="result" id="quizResult" style="display:none"></div>' +
    '</div>';

  restoreQuiz();
  syncReview();
  $('#overlay').classList.add('open');
  $('#mBody').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function thumbBg(cat){
  const g = {
    physics:'linear-gradient(140deg,#1d4ed8,#3b82f6)',
    chem:'linear-gradient(140deg,#6d28d9,#a855f7)',
    bio:'linear-gradient(140deg,#15803d,#22c55e)',
    earth:'linear-gradient(140deg,#0f766e,#14b8a6)',
    tech:'linear-gradient(140deg,#c2410c,#f97316)'
  };
  return g[cat];
}

function closeDetail(){
  $('#overlay').classList.remove('open');
  document.body.style.overflow = '';
  current = null;
  renderGrid();
}

/* ---------- 감상 ---------- */
function syncReview(){
  const ta = $('#reviewText');
  if(!ta) return;
  const len = ta.value.trim().length;
  $('#revLen').textContent = len;
  const savedNow = (state.reviews[current.id] || '').length >= 15;
  $('#btnSave').disabled = len < 15 || (savedNow && ta.value.trim() === state.reviews[current.id]);
  $('#btnSave').textContent = savedNow && ta.value.trim() === state.reviews[current.id] ? '저장됨' : '감상 남기기';
  $('#revDone').style.display = savedNow ? 'inline' : 'none';
}

function saveReview(){
  const v = $('#reviewText').value.trim();
  if(v.length < 15) return;
  state.reviews[current.id] = v;
  save();
  syncReview();
  if(!checkReward()) toast('감상 완료! 퀴즈까지 풀면 \u26A1 에너지를 받아요');
}

/* ---------- 퀴즈 ---------- */
function restoreQuiz(){
  const picked = state.quiz[current.id];
  if(!picked) return;
  picked.forEach((oi,qi) => { if(oi !== null && oi !== undefined) markQuestion(qi, oi); });
  showQuizResult();
}

function markQuestion(qi, oi){
  const ans = current.quiz[qi].answer;
  document.querySelectorAll('.opt[data-q="' + qi + '"]').forEach(btn => {
    const idx = Number(btn.dataset.o);
    btn.disabled = true;
    if(idx === ans){ btn.classList.add('correct'); $('.mark', btn).textContent = '\u2713'; }
    else if(idx === oi){ btn.classList.add('wrong'); $('.mark', btn).textContent = '\u2715'; }
  });
}

function pickOption(qi, oi){
  const picked = state.quiz[current.id] || new Array(current.quiz.length).fill(null);
  if(picked[qi] !== null && picked[qi] !== undefined) return;
  picked[qi] = oi;
  state.quiz[current.id] = picked;
  save();
  markQuestion(qi, oi);
  showQuizResult();
}

function quizStatus(id){
  const c = CONTENTS.find(x => x.id === id);
  const picked = state.quiz[id];
  if(!picked || picked.some(v => v === null || v === undefined)) return null;
  const correct = picked.filter((v,i) => v === c.quiz[i].answer).length;
  return { correct:correct, total:c.quiz.length, pass:(correct / c.quiz.length) >= 0.6 };
}

function showQuizResult(){
  const st = quizStatus(current.id);
  const box = $('#quizResult');
  if(!st || !box) return;
  box.style.display = 'block';
  box.className = 'result ' + (st.pass ? 'pass' : 'fail');
  box.textContent = st.pass
    ? '\u2713 통과 · 정답 ' + st.correct + '/' + st.total
    : '\u2715 아쉬워요 · 정답 ' + st.correct + '/' + st.total + ' · 내용을 다시 확인해 보세요';
  checkReward();
}

/* ---------- 보상 ---------- */
function checkReward(){
  const id = current.id;
  if(state.rewarded[id]) return false;
  const reviewed = (state.reviews[id] || '').length >= 15;
  const st = quizStatus(id);
  if(reviewed && st && st.pass){
    state.rewarded[id] = true;
    save();
    renderEnergy();
    const n = energyCount();
    toast(n % GOAL === 0 ? '\u26A1 에너지 ' + GOAL + '개 달성! 간식 교환 가능' : '\u26A1 에너지 +1 충전!');
    return true;
  }
  return false;
}

/* ===================== 이벤트 ===================== */
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed','false'));
    chip.setAttribute('aria-pressed','true');
    currentCat = chip.dataset.cat;
    renderGrid();
  });
});

$('#btnRandom').addEventListener('click', () => {
  const c = CONTENTS[Math.floor(Math.random() * CONTENTS.length)];
  toast('오늘의 추천 · ' + CATS[c.cat].label + ' 분야');
  openDetail(c.id);
});

$('#grid').addEventListener('click', e => {
  const starBtn = e.target.closest('[data-star]');
  if(starBtn){
    e.stopPropagation();
    const id = starBtn.dataset.star;
    state.stars[id] = !state.stars[id];
    save();
    starBtn.classList.toggle('on', state.stars[id]);
    starBtn.innerHTML = state.stars[id] ? '\u2605' : '\u2606';
    toast(state.stars[id] ? '즐겨찾기에 담았어요' : '즐겨찾기에서 뺐어요');
    return;
  }
  const card = e.target.closest('.card');
  if(card) openDetail(card.dataset.id);
});

$('#btnBack').addEventListener('click', closeDetail);
$('#overlay').addEventListener('click', e => { if(e.target === $('#overlay')) closeDetail(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && current) closeDetail(); });

$('#mStar').addEventListener('click', () => {
  if(!current) return;
  state.stars[current.id] = !state.stars[current.id];
  save();
  $('#mStar').classList.toggle('on', state.stars[current.id]);
  $('#mStar').innerHTML = state.stars[current.id] ? '\u2605' : '\u2606';
});

$('#mBody').addEventListener('click', e => {
  if(e.target.closest('#openLink')){
    toast('게시된 실제 링크로 연결됩니다 (콘텐츠 연동 예정)');
    return;
  }
  if(e.target.closest('#btnSave')){ saveReview(); return; }
  const opt = e.target.closest('.opt');
  if(opt && !opt.disabled) pickOption(Number(opt.dataset.q), Number(opt.dataset.o));
});

$('#mBody').addEventListener('input', e => { if(e.target.id === 'reviewText') syncReview(); });

/* ===================== 시작 ===================== */
renderEnergy();
renderGrid();
</script>
</body>
</html>
